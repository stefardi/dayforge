appId: com.example.dayforge
---
# Flow to test task creation, viewing details, and editing
- launchApp

# Authenticate if currently on the login screen
- runFlow:
    when:
      visible: "Welcome Back"
    file: subflows/login_subflow.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

- assertVisible: "DayForge Dashboard"

# 1. Add a new task entry
- tapOn: "Tambah entri..."
- inputText: "Catatan Baru Maestro"
- hideKeyboard
- tapOn: "Tambah"

# 2. Wait for Supabase insert + list refresh before asserting
- extendedWaitUntil:
    visible: "Catatan Baru Maestro"
    timeout: 8000

# 3. Tap on the task to open Task Detail
- tapOn: "Catatan Baru Maestro"
- assertVisible: "Detail Entri"

# 4. Modify Title and Content
- tapOn: "Catatan Baru Maestro"
- eraseText: 30
- inputText: "Catatan Diedit Maestro"

- tapOn: "Tulis isi catatan di sini..."
- inputText: "Isi detail catatan yang diotomasi oleh Maestro."
- hideKeyboard

# 5. Save changes (via FAB or AppBar save icon)
- tapOn: "Simpan"

# 6. Navigate back to dashboard and verify updated title
- tapOn: "Kembali"
- extendedWaitUntil:
    visible: "DayForge Dashboard"
    timeout: 5000
- extendedWaitUntil:
    visible: "Catatan Diedit Maestro"
    timeout: 5000
