appId: com.example.dayforge
---
# Flow to test deleting an entry via swipe dismiss
- launchApp

- runFlow:
    when:
      visible: "Welcome Back"
    file: subflows/login_subflow.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

- assertVisible: "DayForge Dashboard"

# 1. Add a specific task to delete
- tapOn: "Tambah entri..."
- inputText: "Task To Delete Maestro"
- hideKeyboard
- tapOn: "Tambah"
# Wait for Supabase insert + list refresh
- extendedWaitUntil:
    visible: "Task To Delete Maestro"
    timeout: 8000

# 2. Press, hold, and drag left to delete the task (Dismissible direction: endToStart)
- swipe:
    direction: LEFT
    duration: 1200
    element:
      text: "Task To Delete Maestro"

# 3. Assert the task has been removed
- extendedWaitUntil:
    notVisible: "Task To Delete Maestro"
    timeout: 5000
