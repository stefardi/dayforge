appId: com.example.dayforge
---
# Login flow with credentials
# Run with: maestro test .maestro/login_flow.yaml -e EMAIL=user@example.com -e PASSWORD=yourpass
- launchApp:
    clearState: true

- assertVisible: "Welcome Back"
- runFlow:
    file: subflows/login_subflow.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

- assertVisible: "DayForge Dashboard"
