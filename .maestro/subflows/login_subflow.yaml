appId: com.example.dayforge
---
# Reusable subflow to log in with provided credentials
# Call with: -e EMAIL=user@example.com -e PASSWORD=yourpass
- tapOn:
    text: "Email"
    optional: true
- inputText: ${EMAIL}
- tapOn:
    text: "Password"
    optional: true
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Login"
- extendedWaitUntil:
    visible: "DayForge Dashboard"
    timeout: 10000
