appId: com.example.dayforge
---
# Complete End-to-End User Journey Flow
# Run with: maestro test .maestro/e2e_flow.yaml -e EMAIL=user@example.com -e PASSWORD=yourpass
- launchApp:
    clearState: true

# 1. Navigation Check: Login -> Register -> Login
- assertVisible: "Welcome Back"
- tapOn: "Don't have an account? Register"
- assertVisible: "Create Account"
- tapOn: "Already have an account? Login"
- assertVisible: "Welcome Back"

# 2. Login
- runFlow:
    file: subflows/login_subflow.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

- assertVisible: "DayForge Dashboard"

# 3. Add Task — wait for Supabase to respond and list to refresh
- tapOn: "Tambah entri..."
- inputText: "Maestro E2E Task"
- hideKeyboard
- tapOn: "Tambah"
- extendedWaitUntil:
    visible: "(?s).*Maestro E2E Task.*"
    timeout: 8000

# 4. View and Edit Task Details
- tapOn: "(?s).*Maestro E2E Task.*"
- assertVisible: "Detail Entri"

- tapOn: "Tulis isi catatan di sini..."
- inputText: "Catatan e2e verifikasi Maestro."
- hideKeyboard

- tapOn: "Simpan"

- tapOn: "Kembali"
- extendedWaitUntil:
    visible: "DayForge Dashboard"
    timeout: 5000
- hideKeyboard

# 5. Delete Task — press, hold, and drag left to dismiss
# - extendedWaitUntil:
#     visible: "(?s).*Maestro E2E Task.*"
#     timeout: 8000
# - swipe:
#     direction: LEFT
#     duration: 1200
#     element:
#       text: "(?s).*Maestro E2E Task.*"
# - extendedWaitUntil:
#     notVisible: "(?s).*Maestro E2E Task.*"
#     timeout: 5000
- waitForAnimationToEnd
- swipe:
    from:
      text: "(?s).*Maestro E2E Task.*"
    direction: LEFT
    duration: 600
- extendedWaitUntil:
    notVisible: "(?s).*Maestro E2E Task.*"
    timeout: 8000

# 6. Logout
- runFlow:
    file: subflows/logout_subflow.yaml

- assertVisible: "Welcome Back"
